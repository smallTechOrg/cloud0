# Deploys cloud0 to Cloud Run on every push to main or the v0.1 feature branch, after CI (tests + image smoke) passes.
# Deployments go only through this workflow (push, or by hand: Actions -> deploy-cloud-run -> "Run workflow");
# never deploy to GCP directly from a workstation. deploy/provision.sh sets up everything below once.
#
# Auth is keyless: Workload Identity Federation (provider `cloud0-github` in pool `github`, restricted to push and
# workflow_dispatch runs of this repo) impersonating the shared github-actions-deployer. The service runs as
# cloud0-reader.
# The repo is public, so every identifier comes from repository secrets: GCP_PROJECT_ID, GCP_PROJECT_NUMBER,
# CLOUD0_GCP_PROJECTS, CLOUD0_BIGQUERY_PROJECT, CLOUD0_BILLING_EXPORT_TABLE, CLOUD0_PASSWORD, and optionally
# CLOUD0_BILLING_ACCOUNT_ID, CLOUD0_OPENROUTER_API_KEY.
#
# The URL is public and CLOUD0_PASSWORD guards every page and API call (HTTP Basic auth, any username). The deploy
# refuses to run without it, and the health check confirms a request without it is turned away.
# SQLite lives on the instance and is restored from / streamed to gs://<PROJECT_ID>-cloud0-data by Litestream,
# which is why the service is capped at one instance.
name: deploy-cloud-run
on:
  push:
    # TEMPORARY: ci/cloud-run-deploy deploys too, to try the pipeline from PR #2; remove it before merging.
    branches: [main, feature/cloud0-20261026-1851-v0.1, ci/cloud-run-deploy]
    paths-ignore: ["spec/**", "*.md"]
  workflow_dispatch: {}
concurrency: { group: cloud-run, cancel-in-progress: false }
permissions: { contents: read, id-token: write }
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGION: us-central1
      SERVICE: cloud0
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/cloud0-github
      DEPLOY_SERVICE_ACCOUNT: github-actions-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
    steps:
      - name: Check repository secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          CLOUD0_GCP_PROJECTS: ${{ secrets.CLOUD0_GCP_PROJECTS }}
          CLOUD0_BIGQUERY_PROJECT: ${{ secrets.CLOUD0_BIGQUERY_PROJECT }}
          CLOUD0_BILLING_EXPORT_TABLE: ${{ secrets.CLOUD0_BILLING_EXPORT_TABLE }}
          CLOUD0_PASSWORD: ${{ secrets.CLOUD0_PASSWORD }}
        run: |
          missing=""
          for k in GCP_PROJECT_ID GCP_PROJECT_NUMBER CLOUD0_GCP_PROJECTS CLOUD0_BIGQUERY_PROJECT CLOUD0_BILLING_EXPORT_TABLE CLOUD0_PASSWORD; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Run deploy/provision.sh once (README -> Deploy to Cloud Run)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT }}

      - name: Image name
        id: image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "ref=${REGION}-docker.pkg.dev/${PROJECT}/cloud0/cloud0:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cloudrun
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=cloudrun

      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          CLOUD0_GCP_PROJECTS: ${{ secrets.CLOUD0_GCP_PROJECTS }}
          CLOUD0_BIGQUERY_PROJECT: ${{ secrets.CLOUD0_BIGQUERY_PROJECT }}
          CLOUD0_BILLING_EXPORT_TABLE: ${{ secrets.CLOUD0_BILLING_EXPORT_TABLE }}
          CLOUD0_BILLING_ACCOUNT_ID: ${{ secrets.CLOUD0_BILLING_ACCOUNT_ID }}
          CLOUD0_OPENROUTER_API_KEY: ${{ secrets.CLOUD0_OPENROUTER_API_KEY }}
          CLOUD0_PASSWORD: ${{ secrets.CLOUD0_PASSWORD }}
        run: |
          set -euo pipefail
          export CLOUD0_LITESTREAM_URL="gcs://${PROJECT}-cloud0-data/cloud0.db"

          # Apply (alert policies, budgets) needs the alerts-writer key; it is mounted only when provision.sh stored it.
          SECRET_FLAGS=()
          ALERTS_KEY_VERSION="$(gcloud secrets versions list cloud0-alerts-key --filter=state=ENABLED --limit=1 --format='value(name)' 2>/dev/null || true)"
          if [ -n "$ALERTS_KEY_VERSION" ]; then
            SECRET_FLAGS=(--update-secrets=/secrets/alerts/key.json=cloud0-alerts-key:latest)
            export CLOUD0_ALERTS_CREDENTIALS=/secrets/alerts/key.json
          else
            echo "::notice::No cloud0-alerts-key secret: Alerts, Incidents and Budgets stay read-only."
          fi

          # YAML env file (not --set-env-vars): CLOUD0_GCP_PROJECTS holds commas. It replaces every variable each deploy.
          ENV_FILE="$(mktemp)"; trap 'rm -f "$ENV_FILE"' EXIT
          python3 - "$ENV_FILE" <<'PY'
          import json, os, sys
          env = {k: os.environ[k] for k in ["CLOUD0_GCP_PROJECTS", "CLOUD0_BIGQUERY_PROJECT", "CLOUD0_BILLING_EXPORT_TABLE", "CLOUD0_LITESTREAM_URL", "CLOUD0_PASSWORD"]}
          env.update({k: os.environ[k] for k in ["CLOUD0_BILLING_ACCOUNT_ID", "CLOUD0_OPENROUTER_API_KEY", "CLOUD0_ALERTS_CREDENTIALS"] if os.environ.get(k)})
          env.update(CLOUD0_DB_PATH="/data/cloud0.db", CLOUD0_LOG_LEVEL="info")
          open(sys.argv[1], "w").write("".join(f"{k}: {json.dumps(v)}\n" for k, v in env.items()))
          PY

          # One instance at most: two would each restore and replicate the same SQLite file. Request-based billing
          # is required by org policy (custom.denyInstanceBilling), so Litestream pushes changes while requests run
          # and on shutdown (Cloud Run gives CPU after SIGTERM); only a hard crash in between can lose a write.
          gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE" \
            --service-account "cloud0-reader@${PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8087 --execution-environment gen2 \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 1 --cpu-throttling --no-cpu-boost \
            --concurrency 80 --timeout 900 \
            --env-vars-file "$ENV_FILE" "${SECRET_FLAGS[@]}" --quiet

          echo "url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CLOUD0_PASSWORD: ${{ secrets.CLOUD0_PASSWORD }}
        run: |
          healthy=""
          for i in 1 2 3 4 5 6; do
            if body="$(curl -fsS -m 60 -u "cloud0:${CLOUD0_PASSWORD}" "${URL}/api/v1/health")"; then
              healthy="$(printf '%s' "$body" | jq -c '{ok, version, db, migrations, ui, bigquery: .bigquery.status}')"
              break
            fi
            sleep 10
          done
          [ -n "$healthy" ] || { echo "health check failed"; exit 1; }
          echo "healthy: $healthy"
          # The URL is public: make sure the password really guards it.
          code="$(curl -s -m 30 -o /dev/null -w '%{http_code}' "${URL}/api/v1/health")"
          [ "$code" = 401 ] || { echo "::error::A request without the password got $code, want 401"; exit 1; }
          echo "without the password: 401 as expected"
